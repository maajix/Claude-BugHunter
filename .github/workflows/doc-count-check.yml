name: doc-count-check

# Keeps skill/command counts in docs honest against what's actually on disk.
# Catches stale numbers (e.g. "71 SKILL.md files" after the bundle grew to 82)
# before they merge, and fails when the generated docs/skills.md or
# cbh/data/skill_index.json lag behind skills/. No external dependencies.

on:
  pull_request:
    paths:
      - "skills/**"
      - "commands/**"
      - "README.md"
      - "SECURITY.md"
      - "USAGE.md"
      - "INSTALL.md"
      - "docs/skills.md"
      - "docs/credits.md"
      - "docs/architecture.md"
      - "scripts/check_doc_counts.py"
      - "scripts/gen_skill_catalog.py"
      - "scripts/gen_skill_index.py"
      - "cbh/data/skill_index.json"
      - ".github/workflows/doc-count-check.yml"
  push:
    branches: [main]
    paths:
      - "skills/**"
      - "commands/**"
      - "scripts/check_doc_counts.py"
      - "scripts/gen_skill_catalog.py"
      - "scripts/gen_skill_index.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Check doc counts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify skill/command counts in docs match disk
        run: python3 scripts/check_doc_counts.py

      - name: Regenerate the skill catalog and index
        run: |
          python3 scripts/gen_skill_catalog.py
          python3 scripts/gen_skill_index.py

      - name: Fail if docs/skills.md or cbh/data/skill_index.json is stale
        run: git diff --exit-code -- docs/skills.md cbh/data/skill_index.json
